name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[whisper,faster-whisper,wav2vec2,dev]"
      - name: Test (offline, tiny random models)
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q
